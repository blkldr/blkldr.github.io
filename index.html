<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Payment Portal</title>
  <!-- Tailwind CSS CDN for modern UI -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden p-6 sm:p-8">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold tracking-tight text-white">Complete Your Payment</h1>
      <p class="text-sm text-slate-400 mt-1">Scan the QR code and submit details below</p>
    </div>

    <!-- Amount Display Box -->
    <div class="bg-slate-900/60 border border-slate-700/60 rounded-xl p-4 text-center mb-6">
      <span class="text-xs uppercase tracking-wider text-slate-400 font-medium">Amount to Pay</span>
      <div class="text-3xl font-extrabold text-emerald-400 mt-1">₹13</div>
    </div>

    <!-- QR Code Section -->
    <div class="bg-white p-4 rounded-xl flex flex-col items-center justify-center mb-6 shadow-inner">
      <!-- Replace 'your-qr-code.png' with your actual QR image file/path -->
      <img src="your-qr-code.png" alt="UPI QR Code" class="w-48 h-48 object-contain rounded-lg">
      <span class="text-xs text-slate-500 font-medium mt-2">Scan with GPay, PhonePe, Paytm or any UPI App</span>
    </div>

    <!-- Payment Form -->
    <form id="paymentForm" class="space-y-4">
      
      <!-- UTR Input -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5" for="utr">
          12-Digit UTR / Ref Number <span class="text-red-400">*</span>
        </label>
        <input 
          type="text" 
          id="utr" 
          maxlength="12" 
          placeholder="e.g. 4352xxxxxxxx" 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm tracking-wider font-mono"
          required
        >
      </div>

      <!-- Screenshot Upload -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5" for="screenshot">
          Upload Payment Screenshot <span class="text-red-400">*</span>
        </label>
        <div class="flex items-center justify-center w-full">
          <label class="flex flex-col items-center justify-center w-full h-24 border-2 border-slate-700 border-dashed rounded-lg cursor-pointer bg-slate-950/40 hover:bg-slate-900/60 transition">
            <div class="flex flex-col items-center justify-center pt-3 pb-3 px-4 text-center">
              <p class="text-xs text-slate-300 font-medium" id="fileNameText">Click to upload screenshot</p>
              <p class="text-[10px] text-slate-500 mt-1">PNG, JPG up to 5MB</p>
            </div>
            <input type="file" id="screenshot" accept="image/*" class="hidden" required />
          </label>
        </div>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="w-full mt-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 shadow-lg shadow-emerald-900/20 text-sm tracking-wide"
      >
        Verify & Submit Payment
      </button>
    </form>

    <!-- Footer Security Note -->
    <div class="text-center mt-6">
      <p class="text-[11px] text-slate-500">🔒 Secure Verification Process • Instant Activation</p>
    </div>

  </div>

  <!-- JavaScript for UX Interactions & Validation -->
  <script>
    // Show selected file name on the upload box
    const fileInput = document.getElementById('screenshot');
    const fileNameText = document.getElementById('fileNameText');

    fileInput.addEventListener('change', function(e) {
      if (e.target.files.length > 0) {
        fileNameText.textContent = "Selected: " + e.target.files[0].name;
        fileNameText.classList.add('text-emerald-400', 'font-semibold');
      }
    });

    // Handle Form Submit
    document.getElementById('paymentForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const utr = document.getElementById('utr').value.trim();
      const file = fileInput.files[0];

      // Strict 12-digit check
      if (utr.length !== 12 || isNaN(utr)) {
        alert('Please enter a valid 12-digit UTR/Reference number.');
        return;
      }

      if (!file) {
        alert('Please upload the payment screenshot.');
        return;
      }

      // Package data for backend handling
      const formData = new FormData();
      formData.append('utr', utr);
      formData.append('screenshot', file);

      // Temporary simulation of successful submission
      alert('Payment details submitted successfully! We are verifying your transaction.');
      
      // Clear form after submit
      document.getElementById('paymentForm').reset();
      fileNameText.textContent = "Click to upload screenshot";
      fileNameText.classList.remove('text-emerald-400', 'font-semibold');
    });
  </script>

</body>
</html>
